<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">newCloud — self-hosted file service</title>
  <desc id="desc">A file browser listing folders and files with coloured file-type chips, beside a hash-linked audit chain marked verified. The title reads newCloud, one Go binary and one PostgreSQL database.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1420"/>
      <stop offset="1" stop-color="#11233a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2b7ad1" stop-opacity="0.22"/>
      <stop offset="0.65" stop-color="#2b7ad1" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#2b7ad1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)"/>
  <ellipse cx="1010" cy="80" rx="380" ry="230" fill="url(#glow)"/>

  <!-- title block -->
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <rect x="64" y="83" width="10" height="10" rx="2" fill="#5aa2f2"/>
    <text x="84" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.6" fill="#5aa2f2">SELF-HOSTED FILE SERVICE</text>
    <text x="62" y="184" font-weight="700" font-size="84" letter-spacing="-2.5"><tspan fill="#eef4fb">new</tspan><tspan fill="#6fb0f2">Cloud</tspan></text>
    <text x="64" y="230" font-size="21" font-weight="450" fill="#b9c7d7">Files, WebDAV, SSO, sharing, and</text>
    <text x="64" y="261" font-size="21" font-weight="450" fill="#b9c7d7">a tamper-evident audit trail &#8212; in one</text>
    <text x="64" y="292" font-size="21" font-weight="450" fill="#b9c7d7">Go binary and one PostgreSQL database.</text>
    <text x="64" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="0.4" fill="#7f93a8">GO 1.26+&#160;&#160; &#183; &#160;POSTGRESQL 17&#160;&#160; &#183; &#160;APACHE-2.0</text>
  </g>

  <!-- product proof: file browser -->
  <g id="browser-card" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <rect x="640" y="52" width="496" height="210" rx="16" fill="#101f33" stroke="#2a3f5c"/>
    <circle cx="662" cy="70" r="3.5" fill="#35506f"/>
    <circle cx="676" cy="70" r="3.5" fill="#35506f"/>
    <circle cx="690" cy="70" r="3.5" fill="#35506f"/>
    <text x="712" y="75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#8fa3b8">Files / team</text>
    <line x1="640" y1="88" x2="1136" y2="88" stroke="#243952" stroke-width="1"/>

    <g font-size="18" font-weight="500">
      <rect x="662" y="106" width="24" height="24" rx="7" fill="#fae7c4"/>
      <text x="698" y="124" fill="#dce7f3">Shared with team</text>
      <text x="1114" y="124" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#7f93a8">128 items</text>

      <rect x="662" y="144" width="24" height="24" rx="7" fill="#ffdfe5"/>
      <text x="698" y="162" fill="#dce7f3">Q3-roadmap.pdf</text>
      <text x="1114" y="162" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#7f93a8">2.4 MB</text>

      <rect x="662" y="182" width="24" height="24" rx="7" fill="#c7f7f0"/>
      <text x="698" y="200" fill="#dce7f3">brand-hero.png</text>
      <text x="1114" y="200" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#7f93a8">1.8 MB</text>

      <rect x="662" y="220" width="24" height="24" rx="7" fill="#dbf9dc"/>
      <text x="698" y="238" fill="#dce7f3">webdav-sync.log</text>
      <text x="1114" y="238" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#7f93a8">402 KB</text>
    </g>
  </g>

  <!-- product proof: audit chain -->
  <g id="audit-card" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <rect x="640" y="278" width="496" height="90" rx="16" fill="#5aa2f2" fill-opacity="0.09" stroke="#5aa2f2" stroke-opacity="0.32"/>
    <text x="664" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2" fill="#7fb6f5">AUDIT CHAIN</text>
    <text x="664" y="330" font-size="16" fill="#bccbdb">hash-linked &#183; verify offline</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
      <line x1="920" y1="310" x2="927" y2="310" stroke="#2f5685" stroke-width="1.5"/>
      <rect x="886" y="298" width="34" height="24" rx="6" fill="#0d1b2c" stroke="#2f5685"/>
      <text x="903" y="314" fill="#7fb6f5">a71</text>
      <line x1="961" y1="310" x2="968" y2="310" stroke="#2f5685" stroke-width="1.5"/>
      <rect x="927" y="298" width="34" height="24" rx="6" fill="#0d1b2c" stroke="#2f5685"/>
      <text x="944" y="314" fill="#7fb6f5">0c9</text>
      <line x1="1002" y1="310" x2="1009" y2="310" stroke="#2f5685" stroke-width="1.5"/>
      <rect x="968" y="298" width="34" height="24" rx="6" fill="#0d1b2c" stroke="#2f5685"/>
      <text x="985" y="314" fill="#7fb6f5">5e3</text>
      <line x1="1043" y1="310" x2="1055" y2="310" stroke="#2f5685" stroke-width="1.5"/>
      <rect x="1009" y="298" width="34" height="24" rx="6" fill="#0d1b2c" stroke="#2f5685"/>
      <text x="1026" y="314" fill="#7fb6f5">b82</text>
    </g>
    <circle cx="1084" cy="310" r="15" fill="#2ea36a"/>
    <path d="M1076 310 l6 6 l10 -12" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
