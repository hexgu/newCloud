<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">newCloud architecture</title>
  <desc id="desc">Browser, WebDAV client and share visitors connect to one newcloud Go process exposing the JSON API, web UI, WebDAV, public share pages and OIDC callback. Inside, requests pass through authz, store and audit, with a background worker for garbage collection and scrubbing. Metadata lives in PostgreSQL 17; file bytes live in blob or tree storage, on local disk or S3.</desc>

  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1420"/>
      <stop offset="1" stop-color="#11233a"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2b7ad1" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#2b7ad1" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#2b7ad1" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d5a80"/>
    </marker>
  </defs>

  <rect width="1200" height="470" rx="24" fill="url(#bgGrad2)"/>
  <ellipse cx="1080" cy="40" rx="340" ry="200" fill="url(#glow2)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="52" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.6" fill="#5aa2f2">ARCHITECTURE</text>
    <text x="1148" y="56" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7f93a8">single process &#183; two stores</text>

    <!-- sources -->
    <g id="sources">
      <rect x="52" y="135" width="216" height="62" rx="12" fill="#12233a" stroke="#2a3f5c"/>
      <text x="76" y="163" font-size="20" font-weight="550" fill="#dbe6f2">Browser</text>
      <text x="76" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8fa3b8">session &#183; share pages</text>

      <rect x="52" y="223" width="216" height="62" rx="12" fill="#12233a" stroke="#2a3f5c"/>
      <text x="76" y="251" font-size="20" font-weight="550" fill="#dbe6f2">WebDAV client</text>
      <text x="76" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8fa3b8">desktop &#183; mobile</text>

      <rect x="52" y="311" width="216" height="62" rx="12" fill="#12233a" stroke="#2a3f5c"/>
      <text x="76" y="339" font-size="20" font-weight="550" fill="#dbe6f2">Share visitor</text>
      <text x="76" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8fa3b8">public link</text>

      <line x1="268" y1="166" x2="316" y2="166" stroke="#3d5a80" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="268" y1="254" x2="316" y2="254" stroke="#3d5a80" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="268" y1="342" x2="316" y2="342" stroke="#3d5a80" stroke-width="2" marker-end="url(#arrow)"/>
    </g>

    <!-- process -->
    <g id="process">
      <rect x="320" y="118" width="480" height="272" rx="18" fill="#0f1e31" stroke="#2a3f5c"/>
      <text x="344" y="152" font-size="22" font-weight="650" fill="#eef4fb">newcloud<tspan font-size="14" font-weight="400" fill="#8fa3b8">  &#183;  single Go process</tspan></text>
      <text x="344" y="188" font-size="17" fill="#b6c6d7">JSON API &#183; Web UI &#183; WebDAV</text>
      <text x="344" y="211" font-size="17" fill="#b6c6d7">public share pages &#183; OIDC callback</text>
      <line x1="344" y1="228" x2="776" y2="228" stroke="#243952" stroke-width="1"/>

      <rect x="344" y="252" width="112" height="44" rx="10" fill="#163255" stroke="#2f5685"/>
      <text x="400" y="280" text-anchor="middle" font-size="20" font-weight="600" fill="#cfe0f2">authz</text>
      <line x1="460" y1="274" x2="496" y2="274" stroke="#3d5a80" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="504" y="252" width="112" height="44" rx="10" fill="#163255" stroke="#2f5685"/>
      <text x="560" y="280" text-anchor="middle" font-size="20" font-weight="600" fill="#cfe0f2">store</text>
      <line x1="620" y1="274" x2="656" y2="274" stroke="#3d5a80" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="664" y="252" width="112" height="44" rx="10" fill="#163255" stroke="#2f5685"/>
      <text x="720" y="280" text-anchor="middle" font-size="20" font-weight="600" fill="#cfe0f2">audit</text>

      <rect x="344" y="322" width="240" height="42" rx="10" fill="#12233a" stroke="#2f5685" stroke-dasharray="4 4"/>
      <text x="464" y="349" text-anchor="middle" font-size="15" fill="#9fb2c6">worker &#183; GC &#183; scrub &#183; retention</text>
    </g>

    <!-- stores -->
    <g id="stores">
      <rect x="852" y="118" width="296" height="126" rx="16" fill="#12233a" stroke="#2a3f5c"/>
      <text x="876" y="152" font-size="21" font-weight="650" fill="#eef4fb">PostgreSQL 17</text>
      <text x="876" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#8fa3b8">metadata &#183; versions &#183; quota</text>
      <text x="876" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#8fa3b8">shares &#183; locks &#183; sessions</text>
      <text x="876" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#8fa3b8">jobs &#183; audit chain</text>

      <rect x="852" y="264" width="296" height="126" rx="16" fill="#12233a" stroke="#2a3f5c"/>
      <text x="876" y="298" font-size="21" font-weight="650" fill="#eef4fb">blob / tree storage</text>
      <text x="876" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#8fa3b8">local disk or S3</text>
      <text x="876" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#8fa3b8">content-addressed (blob)</text>
      <text x="876" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#8fa3b8">filesystem mirror (tree)</text>

      <line x1="800" y1="181" x2="848" y2="181" stroke="#3d5a80" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="800" y1="327" x2="848" y2="327" stroke="#3d5a80" stroke-width="2" marker-end="url(#arrow)"/>
    </g>
  </g>
</svg>
